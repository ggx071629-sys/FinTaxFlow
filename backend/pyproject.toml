[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fintaxflow-backend"
version = "0.1.0"
description = "FinTaxFlow FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "PyJWT>=2.10",
  "bcrypt>=4.2",
  "reportlab>=4.2",
  "python-multipart>=0.0.20",
  "playwright>=1.51",
]

[tool.setuptools.packages.find]
include = ["app*"]
